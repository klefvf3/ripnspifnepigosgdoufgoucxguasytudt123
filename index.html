<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>РиП</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
</head>

<body>

  <div class="center-wrapper">
    <div class="code-box" id="code-box">
      <!-- Title Above Input -->
      <div class="brand-title">РиП</div>

      <!-- Code Form -->
      <form id="code-form" autocomplete="off">
        <div class="input-group">
          <input type="text" id="code-input" class="code-input" placeholder="Введите ответ..." autofocus
            spellcheck="false" required>
          <button type="submit" class="btn-submit" id="btn-submit" title="Отправить">
            <span class="btn-spinner" id="btn-spinner" style="display: none;"></span>
            <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>
      </form>

      <!-- Error Message Notice -->
      <div class="error-msg" id="error-msg" style="display: none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="error-text">Неверный код доступа</span>
      </div>

      <!-- 24-Hour Independent Timer Below Input -->
      <div class="timer-container">
        <div class="timer-display" id="timer-display">24:00:00</div>
      </div>
    </div>
  </div>

  <!-- Modal Window "Узнать код" -->
  <div class="modal-overlay" id="code-modal" style="display: none;">
    <div class="modal-card">
      <button type="button" class="modal-close" id="modal-close" aria-label="Закрыть">&times;</button>
      <div class="modal-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2 class="modal-title">Узнать код</h2>
      <p class="modal-desc">Время таймера истекло. Нажмите на кнопку, чтобы получить доступ к коду.</p>
      <button type="button" class="btn-reveal-code" id="btn-reveal-code">
        <span>Узнать код</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script src="script.js?v=4"></script>
</body>

</html>
